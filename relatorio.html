<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Relatorio Inventario QR</title>
<style>
:root{--green:#3B6D11;--green-l:#EAF3DE;--yellow:#B8860B;--yellow-l:#FEFBE8;--red:#A32D2D;--red-l:#FCEBEB;--blue:#185FA5;--blue-l:#E6F1FB;--orange:#7A3500;--orange-l:#FFF0E0;--bg:#f5f5f2;--bg2:#fff;--text:#1a1a18;--text2:#6b6b67;--bor:rgba(0,0,0,0.10);}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#242422;--text:#f0efe9;--text2:#9a9a94;--bor:rgba(255,255,255,0.10);}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top-bar{background:var(--blue);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top-bar h1{font-size:16px;font-weight:700}
.top-bar .meta{font-size:11px;opacity:.8;text-align:right}
.legenda{display:flex;gap:18px;background:var(--bg2);border-bottom:0.5px solid var(--bor);padding:10px 20px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.leg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.content{padding:16px 20px;max-width:1200px;margin:0 auto}
.dia{background:var(--bg2);border-radius:12px;border:0.5px solid var(--bor);margin-bottom:20px;overflow:hidden}
.dia-header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:0.5px solid var(--bor);background:rgba(0,0,0,.02)}
.dia-data{font-size:15px;font-weight:700;color:var(--text)}
.dia-total{font-size:12px;color:var(--text2);font-weight:500}
.cols-wrap{display:flex;gap:0;overflow-x:auto;padding:14px 16px;gap:12px;flex-wrap:wrap}
.col{min-width:160px;flex:0 0 auto}
.col-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:5px 10px;border-radius:6px;margin-bottom:6px;text-align:center;color:#fff;background:var(--blue)}
.col-header.h86{background:var(--orange)}
.eq-row{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:background .15s;border:0.5px solid transparent;margin-bottom:3px;user-select:none}
.eq-row:hover{background:var(--bg);border-color:var(--bor)}
.eq-row.copiado{background:var(--yellow-l);border-color:rgba(184,134,11,.25)}
.eq-row.vermelho{background:var(--red-l);border-color:rgba(163,45,45,.25);opacity:.7}
.bolinha{display:inline-block;width:11px;height:11px;border-radius:50%;flex-shrink:0;transition:background .2s}
.bolinha.verde{background:var(--green)}
.bolinha.amarelo{background:var(--yellow)}
.bolinha.vermelho{background:var(--red)}
.eq-code{font-size:13px;font-weight:600;flex:1;color:var(--text)}
.eq-row.copiado .eq-code{color:var(--yellow)}
.eq-row.vermelho .eq-code{color:var(--red);text-decoration:line-through}
.x-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:15px;padding:2px 4px;line-height:1;border-radius:4px;opacity:.5}
.x-btn:hover{opacity:1;color:var(--red)}
.toast-rel{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:#1a1a18;color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;z-index:99;transition:transform .25s ease;white-space:nowrap;opacity:0}
.toast-rel.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast-rel.green{background:#27500A}
.resumo{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:14px 16px;border-top:0.5px solid var(--bor);background:rgba(0,0,0,.015)}
.resumo-item{text-align:center;padding:8px;border-radius:8px;background:var(--bg2);border:0.5px solid var(--bor)}
.resumo-n{font-size:20px;font-weight:700;color:var(--text)}
.resumo-l{font-size:10px;color:var(--text2);margin-top:2px}
</style>
</head>
<body>
<div class="top-bar"><h1>&#128200; Relatorio Inventario QR</h1><div class="meta">Gerado em 19/06/2026, 11:40:59<br>10 equipamento(s) no total</div></div>
<div class="legenda"><div class="leg-item"><div class="leg-dot" style="background:#3B6D11"></div> Verde — Disponivel</div><div class="leg-item"><div class="leg-dot" style="background:#B8860B"></div> Amarelo — Romaneio</div><div class="leg-item"><div class="leg-dot" style="background:#A32D2D"></div> Vermelho — Bloqueado</div></div>
<div class="content"><section class="dia"><div class="dia-header"><div class="dia-data">19/06/2026</div><div class="dia-total">10 equipamento(s)</div></div><div class="cols-wrap"><div class="col"><div class="col-header h86">Modelo 86</div><div class="eq-row" id="eq-86_147296" data-codigo="86-147296" data-numero="147296" onclick="handleClick(this)"><span class="bolinha verde" id="b-eq-86_147296"></span><span class="eq-code">147296</span><button class="x-btn" onclick="marcarVermelho(event,'eq-86_147296')" title="Marcar problema">&#215;</button></div><div class="eq-row" id="eq-86_149344" data-codigo="86-149344" data-numero="149344" onclick="handleClick(this)"><span class="bolinha verde" id="b-eq-86_149344"></span><span class="eq-code">149344</span><button class="x-btn" onclick="marcarVermelho(event,'eq-86_149344')" title="Marcar problema">&#215;</button></div><div class="eq-row" id="eq-86_149499" data-codigo="86-149499" data-numero="149499" onclick="handleClick(this)"><span class="bolinha verde" id="b-eq-86_149499"></span><span class="eq-code">149499</span><button class="x-btn" onclick="marcarVermelho(event,'eq-86_149499')" title="Marcar problema">&#215;</button></div><div class="eq-row" id="eq-86_165143" data-codigo="86-165143" data-numero="165143" onclick="handleClick(this)"><span class="bolinha verde" id="b-eq-86_165143"></span><span class="eq-code">165143</span><button class="x-btn" onclick="marcarVermelho(event,'eq-86_165143')" title="Marcar problema">&#215;</button></div><div class="eq-row" id="eq-86_183265" data-codigo="86-183265" data-numero="183265" onclick="handleClick(this)"><span class="bolinha verde" id="b-eq-86_183265"></span><span class="eq-code">183265</span><button class="x-btn" onclick="marcarVermelho(event,'eq-86_183265')" title="Marcar problema">&#215;</button></div><div class="eq-row" id="eq-86_138989" data-codigo="86-138989" data-numero="138989" onclick="handleClick(this)"><span class="bolinha verde" id="b-eq-86_138989"></span><span class="eq-code">138989</span><button class="x-btn" onclick="marcarVermelho(event,'eq-86_138989')" title="Marcar problema">&#215;</button></div><div class="eq-row" id="eq-86_135398" data-codigo="86-135398" data-numero="135398" onclick="handleClick(this)"><span class="bolinha verde" id="b-eq-86_135398"></span><span class="eq-code">135398</span><button class="x-btn" onclick="marcarVermelho(event,'eq-86_135398')" title="Marcar problema">&#215;</button></div><div class="eq-row" id="eq-86_121663" data-codigo="86-121663" data-numero="121663" onclick="handleClick(this)"><span class="bolinha verde" id="b-eq-86_121663"></span><span class="eq-code">121663</span><button class="x-btn" onclick="marcarVermelho(event,'eq-86_121663')" title="Marcar problema">&#215;</button></div><div class="eq-row" id="eq-86_119531" data-codigo="86-119531" data-numero="119531" onclick="handleClick(this)"><span class="bolinha verde" id="b-eq-86_119531"></span><span class="eq-code">119531</span><button class="x-btn" onclick="marcarVermelho(event,'eq-86_119531')" title="Marcar problema">&#215;</button></div><div class="eq-row" id="eq-86_115372" data-codigo="86-115372" data-numero="115372" onclick="handleClick(this)"><span class="bolinha verde" id="b-eq-86_115372"></span><span class="eq-code">115372</span><button class="x-btn" onclick="marcarVermelho(event,'eq-86_115372')" title="Marcar problema">&#215;</button></div></div></div></section></div>
<div class="toast-rel" id="toast-rel"></div>
<script>
var estados={};
function salvar(){try{localStorage.setItem("inv_status",JSON.stringify(estados));}catch(e){}}
function carregar(){try{var s=localStorage.getItem("inv_status");if(s){estados=JSON.parse(s);Object.keys(estados).forEach(function(id){aplicarEstado(id,estados[id]);});}}catch(e){}}
function aplicarEstado(id,st){
  var row=document.getElementById(id);
  var b=document.getElementById("b-"+id);
  if(!row||!b)return;
  row.className="eq-row"+(st==="copiado"?" copiado":st==="vermelho"?" vermelho":"");
  b.className="bolinha "+(st==="copiado"?"amarelo":st==="vermelho"?"vermelho":"verde");
}
function handleClick(row){
  var id=row.id;
  var numero=row.getAttribute("data-numero")||row.getAttribute("data-codigo");
  if(estados[id]==="vermelho") return;
  navigator.clipboard.writeText(numero).then(function(){
    estados[id]="copiado";
    aplicarEstado(id,"copiado");
    salvar();
    showToast(numero+" copiado!","green");
  }).catch(function(){
    showToast("Erro ao copiar","");
  });
}
function marcarVermelho(ev,id){
  ev.stopPropagation();
  if(estados[id]==="vermelho"){
    estados[id]="verde";
    aplicarEstado(id,"verde");
  } else {
    estados[id]="vermelho";
    aplicarEstado(id,"vermelho");
  }
  salvar();
}
var toastT;
function showToast(msg,type){
  var el=document.getElementById("toast-rel");
  el.textContent=msg;
  el.className="toast-rel show "+(type||"");
  clearTimeout(toastT);
  toastT=setTimeout(function(){el.className="toast-rel";},2200);
}
carregar();
</script>
</body>
</html>
